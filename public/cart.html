<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your cart — Aman Pharma v1.4</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/mark.png">
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="nav-shell">
      <a href="index.html" class="brand">
        <span class="logo-icon"><img src="images/mark.png" alt="Aman Pharma"></span>
        <span class="brand-text">Aman Pharma<em>v1.4 Healthcare</em></span>
      </a>
      <nav class="nav-pill" id="navLinks">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
        <a href="store.html">Store</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="nav-cart active">Cart <span class="cart-count" id="cartCount">0</span></a>
        <a href="auth.html" class="nav-login" id="authNav">Login</a>
        <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu"><span></span><span></span></button>
      </div>
    </div>
  </header>

  <section class="page-hero mesh">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="container">
      <span class="eyebrow">Checkout</span>
      <h1>Your cart</h1>
      <p>Review your items, add a delivery address and place your order.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="cartContainer"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><p>&copy; 2026 Aman Pharma v1.4</p></div>
    </div>
  </footer>
  <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <script src="js/app.js"></script>
  <script>
    let cartProducts = {};
    document.addEventListener('DOMContentLoaded', () => {
      updateNavAuth(); updateCartCount();
      loadCart();
    });
    async function loadCart() {
      if (!isLoggedIn()) { document.getElementById('cartContainer').innerHTML = `<div class="cart-empty"><div class="big">🛒</div><h3>Please log in to view your cart</h3><p>Log in or create an account to continue shopping.</p><a href="auth.html" class="btn-primary">Login / Register</a></div>`; return; }
      let cart, products;
      try {
        const res = await fetch('/api/cart', { headers: authHeaders() });
        if (res.status === 401) { window.location.href = 'auth.html'; return; }
        ({ cart } = await res.json());
        const prodRes = await fetch('/api/products');
        ({ products } = await prodRes.json());
      } catch (e) { document.getElementById('cartContainer').innerHTML = apiUnavailableNote(); return; }
      cartProducts = {};
      products.forEach(p => cartProducts[p.id] = p);
      renderCart(cart);
    }
    function renderCart(cart) {
      const container = document.getElementById('cartContainer');
      if (!cart || !cart.length) {
        container.innerHTML = `<div class="cart-empty"><div class="big">🛒</div><h3>Your cart is empty</h3><p>Browse the store and add some medicines.</p><a href="store.html" class="btn-primary">Go to store</a></div>`;
        return;
      }
      let subtotal = 0;
      const items = cart.map(ci => { const p = cartProducts[ci.productId]; if (!p) return null; subtotal += p.price * ci.qty; return { ci, p }; }).filter(Boolean);
      const shipping = subtotal > 500 ? 0 : 50;
      const total = subtotal + shipping;
      container.innerHTML = `
        <div class="cart-layout">
          <div>
            ${items.map(({ ci, p }) => `
              <div class="cart-item">
                <div class="cart-item-icon">${p.icon}</div>
                <div class="cart-item-info">
                  <h4 style="font-family:'Inter',sans-serif;font-size:1rem;font-weight:500">${p.name}</h4>
                  <p style="color:var(--muted);font-size:0.84rem">Br ${p.price} each</p>
                  <div class="qty-control" style="margin-top:10px">
                    <button onclick="changeQty(${p.id}, ${ci.qty - 1})">−</button>
                    <span style="font-weight:500;min-width:30px;text-align:center">${ci.qty}</span>
                    <button onclick="changeQty(${p.id}, ${ci.qty + 1})">+</button>
                  </div>
                </div>
                <div style="text-align:right">
                  <div class="price" style="margin-bottom:10px">Br ${p.price * ci.qty}</div>
                  <button class="remove-btn" onclick="removeItem(${p.id})">Remove</button>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="cart-summary">
            <h3 style="font-family:'Inter',sans-serif;font-size:1.1rem;font-weight:500;margin-bottom:14px">Order summary</h3>
            <div class="summary-row"><span>Subtotal</span><span style="color:var(--ink)">Br ${subtotal}</span></div>
            <div class="summary-row"><span>Shipping</span><span style="color:var(--ink)">${shipping === 0 ? '<span style="color:var(--sky-700)">FREE</span>' : 'Br ' + shipping}</span></div>
            <div class="summary-row" style="border-bottom:none;font-weight:600;font-size:1.1rem;padding-top:16px"><span style="color:var(--ink)">Total</span><span style="color:var(--ink)">Br ${total}</span></div>
            <form class="checkout-form" onsubmit="checkout(event)">
              <label>Delivery address</label>
              <input type="text" id="address" placeholder="Full delivery address" required>
              <label>Payment method</label>
              <select id="payment"><option value="cod">Cash on delivery</option><option value="card">Credit / debit card</option><option value="upi">UPI</option></select>
              <button type="submit" class="btn-primary" style="width:100%;padding:14px;border:none;margin-top:4px">Place order</button>
            </form>
          </div>
        </div>
      `;
    }
    async function changeQty(productId, qty) {
      if (qty <= 0) { removeItem(productId); return; }
      const res = await fetch('/api/cart/update', { method: 'PUT', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ productId, qty }) });
      if (res.ok) { const { cart } = await res.json(); updateCartCount(); renderCart(cart); }
    }
    async function removeItem(productId) {
      const res = await fetch('/api/cart/remove/' + productId, { method: 'DELETE', headers: authHeaders() });
      if (res.ok) { const { cart } = await res.json(); updateCartCount(); renderCart(cart); }
    }
    async function checkout(e) {
      e.preventDefault();
      const address = document.getElementById('address').value;
      const paymentMethod = document.getElementById('payment').value;
      const res = await fetch('/api/orders', { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ address, paymentMethod }) });
      if (res.ok) {
        const { order } = await res.json();
        updateCartCount();
        document.getElementById('cartContainer').innerHTML = `<div class="cart-empty"><div class="big">✅</div><h3 style="color:var(--sky-700)">Order placed successfully!</h3><p>Order ID: #${order.id} · Total: Br ${order.total} (${order.paymentMethod.toUpperCase()})</p><a href="store.html" class="btn-primary">Continue shopping</a></div>`;
      } else {
        const err = await res.json();
        alert(err.error || 'Checkout failed');
      }
    }
    window.addEventListener('scroll', () => { document.getElementById('scrollTop').style.display = window.scrollY > 400 ? 'flex' : 'none'; });
  </script>
</body>
</html>
